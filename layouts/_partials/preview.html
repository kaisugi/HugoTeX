<article class="post-preview">
  <h2 class="post-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>
  <div class="postmeta">
    {{ partial "postmeta.html" . }}
  </div>
  <div class="post-entry">
    {{ if in .RawContent "<!--more-->" }}
      {{ .Summary }}
    {{ end }}
  </div>
</article>
